<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ustad Number King</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.container {
    width: 320px;
    background: #0a0a0a;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255, 200, 0, 0.2);
    border: 1px solid rgba(255, 200, 0, 0.2);
}

/* Title */
.title {
    color: #f5d97c;
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

/* Profile Image */
.profile {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid gold;
    margin: auto;
    overflow: hidden;
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Offer */
.offer {
    color: #00ff88;
    font-weight: bold;
    margin: 15px 0;
}

/* Timer */
.timer {
    font-size: 32px;
    color: #fff;
    margin: 10px 0;
}

/* Live */
.live {
    background: #111;
    padding: 8px;
    border-radius: 10px;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 15px;
}

/* Buttons */
.btn {
    display: block;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}

.btn-join {
    background: linear-gradient(90deg, gold, #f5d97c);
    color: #000;
}

.btn-claim {
    border: 1px solid gold;
    color: gold;
}

/* Footer */
.footer {
    font-size: 10px;
    color: #555;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">USTAD NUMBER KING</div>

    <div class="profile">
        <img src="https://i.imgur.com/8Km9tLL.jpg">
    </div>

    <div class="offer">⚡ DAILY ₹2000 FREE GIFTCODE 💰</div>

    <div class="timer" id="countdown">00:30</div>

    <div class="live">🔴 LIVE • 263 USERS IN VC</div>

    <a href="#" class="btn btn-join">JOIN VIP NOW</a>

    <a href="#" class="btn btn-claim">CLAIM GIFTCODE</a>

    <div class="footer">ADS BY TG @TOPSADAGENCY</div>

</div>

<script>
let time = 30;
let countdown = document.getElementById("countdown");

setInterval(() => {
    if (time > 0) {
        time--;
        countdown.innerText = "00:" + (time < 10 ? "0" + time : time);
    }
}, 1000);
</script>

</body>
</html>
