<meta charset="UTF-8">

<title>Jai Club Tool</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background: radial-gradient(circle at top,#0a1a2f,#020814);
    color:white;
    text-align:center;
}

.container{
    padding:30px 20px;
}

.logo{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid gold;
    box-shadow:0 0 25px gold;
}

h1{
    margin-top:15px;
    font-size:28px;
    font-weight:700;
}

.sub{
    color:#fbc02d;
    margin-top:5px;
    font-weight:600;
}

.desc{
    margin-top:10px;
    color:#ccc;
    font-size:14px;
}

/* Timer */
.timer{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:10px;
    background:#111;
    padding:15px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(255,215,0,0.3);
}

.time-box{
    text-align:center;
}

.time{
    font-size:22px;
    font-weight:700;
    color:#fbc02d;
}

.label{
    font-size:12px;
    color:#aaa;
}

/* Button */
.btn{
    margin-top:25px;
    display:inline-block;
    background:linear-gradient(45deg,#ffb300,#ff6f00);
    padding:15px 25px;
    border-radius:12px;
    font-weight:700;
    color:black;
    text-decoration:none;
    box-shadow:0 0 15px #ffb300;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.footer{
    margin-top:30px;
    font-size:12px;
    color:#777;
}
</style>

</head>

<body>

<div class="container">

    <img src="https://files.catbox.moe/t6p048.jpg" class="logo">

    <h1>Jai Club Tool</h1>
    <div class="sub">Recover All Your Losses</div>
    <div class="sub">Get 95% Accurate Shots 🔥</div>

    <div class="desc">
        Join my exclusive Telegram group for premium tips, live market updates & VIP strategies!
    </div>

    <!-- Timer -->
    <div class="timer">
        <div class="time-box">
            <div class="time" id="days">00</div>
            <div class="label">DAYS</div>
        </div>
        <div class="time-box">
            <div class="time" id="hours">00</div>
            <div class="label">HOURS</div>
        </div>
        <div class="time-box">
            <div class="time" id="minutes">00</div>
            <div class="label">MINS</div>
        </div>
        <div class="time-box">
            <div class="time" id="seconds">00</div>
            <div class="label">SECS</div>
        </div>
    </div>

    <div style="margin-top:15px;color:#fbc02d;">
        👇 Click below before link expires 👇
    </div>

    <a href="https://t.me/+yFTwwy2Zu-I3NTI1" class="btn">
        🚀 JOIN FREE TELEGRAM
    </a>

    <div class="footer">
        ADS MANAGED BY TG @OpARRU
    </div>

</div>

<script>
let time = 700;

let timer = setInterval(()=>{
    let days = Math.floor(time / 86400);
    let hours = Math.floor((time % 86400) / 3600);
    let minutes = Math.floor((time % 3600) / 60);
    let seconds = time % 60;

    document.getElementById("days").innerText = String(days).padStart(2,'0');
    document.getElementById("hours").innerText = String(hours).padStart(2,'0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2,'0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2,'0');

    if(time > 0){
        time--;
    } else {
        clearInterval(timer);
        window.location.href = "https://t.me/+yFTwwy2Zu-I3NTI1";
    }

},1000);
</script>

</body>
</html>
